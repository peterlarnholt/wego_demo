<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copa 2026 — Jogos ao vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sol:#FFB627;--verde:#2FBF71;--coral:#FF6B5A;--grafite:#2B2D33;--creme:#FFF9F0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--creme);color:var(--grafite);padding:32px 16px}
.wrap{max-width:720px;margin:0 auto}
h1{font-family:Poppins;font-weight:800;font-size:30px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.sub{color:#7a7c82;margin:4px 0 22px;font-size:15px;display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--verde);animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(47,191,113,.5)}70%{box-shadow:0 0 0 9px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
.round{font-family:Poppins;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);margin:26px 0 12px}
.match{background:#fff;border-radius:16px;padding:14px 18px;box-shadow:0 8px 24px rgba(43,45,51,.07);margin-bottom:10px;display:flex;align-items:center;gap:14px}
.teams{flex:1;display:flex;flex-direction:column;gap:8px}
.team{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.team img{width:24px;height:24px;object-fit:contain}
.team .sc{margin-left:auto;font-family:Poppins;font-weight:800;font-size:18px}
.team.win .sc{color:var(--verde)}
.team.lose{opacity:.55}
.meta{text-align:right;min-width:96px;font-size:12px;color:#8b8d93;line-height:1.5}
.badge{display:inline-block;font-family:Poppins;font-weight:700;font-size:11px;padding:3px 9px;border-radius:999px}
.b-ft{background:#eef;color:#556}
.b-live{background:var(--verde);color:#fff}
.b-ns{background:#FFF1D6;color:#B87500}
.foot{margin-top:26px;text-align:center;color:#9b9da3;font-size:12px}
.err{background:#fff;border:1px solid var(--coral);color:var(--coral);border-radius:14px;padding:16px;text-align:center}
</style></head><body>
<div class="wrap">
  <h1>⚽ Copa 2026</h1>
  <div class="sub"><span class="live"></span> Jogos e resultados — snapshot ao vivo</div>
  <div id="board">Carregando…</div>
  <div class="foot">dabbl · dados ao vivo · atualizado <span id="upd">—</span></div>
</div>
<script>
const ORDER=["Group","Round of 16","Quarter-finals","Semi-finals","3rd Place Final","Final"];
function rk(r){for(let i=0;i<ORDER.length;i++)if(r.includes(ORDER[i]))return i;return 99;}
function fmt(iso){const d=new Date(iso);return d.toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
function badge(s){if(["1H","2H","HT","ET","LIVE","P"].includes(s))return '<span class="badge b-live">AO VIVO</span>';
  if(["FT","AET","PEN"].includes(s))return '<span class="badge b-ft">'+(s==='FT'?'ENCERRADO':s)+'</span>';
  return '<span class="badge b-ns">EM BREVE</span>';}
function teamRow(name,logo,score,win,played){
  let cls='team';if(played){if(win)cls+=' win';else cls+=' lose';}
  return '<div class="'+cls+'"><img src="'+logo+'" onerror="this.style.visibility=\'hidden\'"><span>'+name+'</span>'
    +'<span class="sc">'+(played?(score??0):'')+'</span></div>';}
async function load(){

    const j={ok:true,fixtures:[{"id": 1565179, "date": "2026-07-03T22:00:00+00:00", "status": "AET", "status_long": "Match Finished", "round": "Round of 32", "venue": "Hard Rock Stadium", "city": "Miami", "home": "Argentina", "away": "Cape Verde Islands", "home_logo": "https://media.api-sports.io/football/teams/26.png", "away_logo": "https://media.api-sports.io/football/teams/1533.png", "gh": 3, "ga": 2, "home_win": true, "away_win": false}, {"id": 1567310, "date": "2026-07-04T01:30:00+00:00", "status": "FT", "status_long": "Match Finished", "round": "Round of 32", "venue": "Arrowhead Stadium", "city": "Kansas City", "home": "Colombia", "away": "Ghana", "home_logo": "https://media.api-sports.io/football/teams/8.png", "away_logo": "https://media.api-sports.io/football/teams/1504.png", "gh": 1, "ga": 0, "home_win": true, "away_win": false}, {"id": 1567824, "date": "2026-07-04T17:00:00+00:00", "status": "FT", "status_long": "Match Finished", "round": "Round of 16", "venue": "NRG Stadium", "city": "Houston", "home": "Canada", "away": "Morocco", "home_logo": "https://media.api-sports.io/football/teams/5529.png", "away_logo": "https://media.api-sports.io/football/teams/31.png", "gh": 0, "ga": 3, "home_win": false, "away_win": true}, {"id": 1569870, "date": "2026-07-04T21:00:00+00:00", "status": "FT", "status_long": "Match Finished", "round": "Round of 16", "venue": "Lincoln Financial Field", "city": "Philadelphia", "home": "Paraguay", "away": "France", "home_logo": "https://media.api-sports.io/football/teams/2380.png", "away_logo": "https://media.api-sports.io/football/teams/2.png", "gh": 0, "ga": 1, "home_win": false, "away_win": true}, {"id": 1568100, "date": "2026-07-05T20:00:00+00:00", "status": "FT", "status_long": "Match Finished", "round": "Round of 16", "venue": "MetLife Stadium", "city": "East Rutherford", "home": "Brazil", "away": "Norway", "home_logo": "https://media.api-sports.io/football/teams/6.png", "away_logo": "https://media.api-sports.io/football/teams/1  "gh": 0, "ga": 0, "home_win": true, "away_win": false}, {"id": 1578539, "date": "2026-07-09T20:00:00+00:00", "status": "FT", "status_long": "Match Finished", "round": "Quarter-finals", "venue": "Gillette Stadium", "city": "Boston", "home": "France", "away": "Morocco", "home_logo": "https://media.api-sports.io/football/teams/2.png", "away_logo": "https://media.api-sports.io/football/teams/31.png", "gh": 2, "ga": 0, "home_win": true, "away_win": false}, {"id": 1581821, "date": "2026-07-10T19:00:00+00:00", "status": "FT", "status_long": "Match Finished", "round": "Quarter-finals", "venue": "SoFi Stadium", "city": "Los Angeles", "home": "Spain", "away": "Belgium", "home_logo": "https://media.api-sports.io/football/teams/9.png", "away_logo": "https://media.api-sports.io/football/teams/1.png", "gh": 2, "ga": 1, "home_win": true, "away_win": false}, {"id": 1581037, "date": "2026-07-11T21:00:00+00:00", "status": "AET", "status_long": "Match Finished", "round": "Quarter-finals", "venue": "Hard Rock Stadium", "city": "Miami", "home": "Norway", "away": "England", "home_logo": "https://media.api-sports.io/football/teams/1090.png", "away_logo": "https://media.api-sports.io/football/teams/10.png", "gh": 1, "ga": 2, "home_win": false, "away_win": true}, {"id": 1582681, "date": "2026-07-12T01:00:00+00:00", "status": "AET", "status_long": "Match Finished", "round": "Quarter-finals", "venue": "Arrowhead Stadium", "city": "Kansas City", "home": "Argentina", "away": "Switzerland", "home_logo": "https://media.api-sports.io/football/teams/26.png", "away_logo": "https://media.api-sports.io/football/teams/15.png", "gh": 3, "ga": 1, "home_win": true, "away_win": false}, {"id": 1585131, "date": "2026-07-14T19:00:00+00:00", "status": "FT", "status_long": "Match Finished", "round": "Semi-finals", "venue": "Dallas Stadium", "city": "Arlington", "home": "France", "away": "Spain", "home_logo": "https://media.api-sports.io/football/teams/2.png", "away_logo": "https://media.api-sports.io/football/teams/9.png", "gh": 0, "ga": 2, "home_win": false, "away_win": true}, {"id": 1586077, "date": "2026-07-15T19:00:00+00:00", "status": "NS", "status_long": "Not Started", "round": "Semi-finals", "venue": "Mercedes-Benz Stadium", "city": "Atlanta", "home": "England", "away": "Argentina", "home_logo": "https://media.api-sports.io/football/teams/10.png", "away_logo": "https://media.api-sports.io/football/teams/26.png", "gh": null, "ga": null, "home_win": null, "away_win": null}]};
    if(!j.ok)throw new Error(j.error||'erro');
    const groups={};
    j.fixtures.forEach(f=>{(groups[f.round]=groups[f.round]||[]).push(f);});
    const rounds=Object.keys(groups).sort((a,b)=>rk(a)-rk(b)||a.localeCompare(b));
    let html='';
    rounds.forEach(rd=>{
      html+='<div class="round">'+rd+'</div>';
      groups[rd].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(f=>{
        const played=["FT","AET","PEN"].includes(f.status);
        html+='<div class="match"><div class="teams">'
          +teamRow(f.home,f.home_logo,f.gh,f.home_win,played)
          +teamRow(f.away,f.away_logo,f.ga,f.away_win,played)
          +'</div><div class="meta">'+badge(f.status)+'<br>'+fmt(f.date)
          +(f.city?'<br>'+f.city:'')+'</div></div>';
      });
    });
    document.getElementById('board').innerHTML=html||'Sem jogos.';
    document.getElementById('upd').textContent=new Date().toLocaleTimeString('pt-BR');
  }catch(e){
    document.getElementById('board').innerHTML='<div class="err">Não consegui carregar os jogos: '+e.message+'</div>';
  }
}
load();
</script>
</body></html>
